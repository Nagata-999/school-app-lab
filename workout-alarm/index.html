<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MOVE TO WAKE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a2a;color:#f4f7fc;font-family:system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:20px 14px 70px}h1{font-size:30px;margin:10px 0}h2{font-size:20px}.sub,.note{color:#b6c4d6;line-height:1.6}.panel{background:#1b2b40;border:1px solid #344961;border-radius:18px;padding:18px;margin:14px 0}button,select,input{font:inherit;border-radius:12px;min-height:50px}button{border:0;padding:12px 15px;font-weight:800;background:#5de1b1;color:#09231b;cursor:pointer;touch-action:manipulation}button.secondary{background:#364c65;color:white}button.danger{background:#f6a4b3;color:#4c1020}button:disabled{opacity:.4}label{display:block;margin:12px 0 6px;color:#c6d6e7}input,select{background:#0e1a29;color:white;border:1px solid #64748b;padding:9px;width:100%}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.clock{font-size:clamp(36px,10vw,55px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums}.hidden{display:none}.alert{border:2px solid #ff8195;background:#442435}.count{text-align:center;font-size:70px;font-weight:900;color:#5de1b1}.stack{display:grid;gap:12px}#tap{min-height:170px;font-size:23px}#status{color:#c6d6e7;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#112035;padding:12px 5px;text-align:center;border-radius:10px}.stat strong{display:block;font-size:25px;color:#5de1b1}.stat small{font-size:11px;color:#c6d6e7}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{text-align:center;padding:10px 0;background:#30435b;border-radius:7px;font-size:12px}.day.done{background:#17765c}.day.today{outline:2px solid #5de1b1}.day.empty{background:transparent}@media(max-width:400px){main{padding:12px 10px 65px}.panel{padding:14px}button{font-size:14px}h1{font-size:26px}}
</style></head><body><main>

<section class="panel"><div id="clock" class="clock">--:--:--</div><label>アラーム時刻</label><div class="row"><input id="time" type="time"><button id="set">セット</button></div><label>運動の種類</label><select id="exercise"><option value="squat">スクワット</option><option value="pushup">腕立て伏せ</option></select><label>目標回数</label><select id="goal"><option value="5">5回</option><option value="10" selected>10回</option><option value="20">20回</option></select><p id="status">アラーム未設定</p><div class="stack"><button id="enable" class="secondary">🔊 音声を有効にする</button><button id="demo">⏰ 今すぐ鳴らしてデモ</button></div></section>
<section id="alert" class="panel alert hidden" role="alert"><h2>⏰ 起きる時間です！</h2><p class="note">安全な姿勢で運動し、1回ごとに画面をタップしてください。</p><div class="count"><span id="count">0</span><small id="outof" style="font-size:20px"> / 10</small></div><div class="stack"><button id="tap">👇 運動1回ごとにタップ</button><button id="emergency" class="danger">緊急停止（記録しない）</button></div><p class="note">動作の自動検出はありません。体調が悪いときは緊急停止してください。</p></section>
<section class="panel"><h2>📈 マイ記録</h2><div class="stats"><div class="stat"><strong id="streak">0</strong><small>連続日数</small></div><div class="stat"><strong id="days">0</strong><small>達成日数</small></div><div class="stat"><strong id="total">0</strong><small>累計回数</small></div></div><h2>🗓️ 今月のカレンダー</h2><div id="calendar" class="calendar"></div><h2>🏅 実績</h2><p id="badges"></p><h2>最近の記録</h2><ol id="history"></ol><button id="reset" class="secondary">記録を初期化</button></section>
<p class="note">授業用プロトタイプです。ブラウザのタブを開いている間だけ時刻を監視します。iPhoneの画面ロック中やバックグラウンドで鳴る保証はありません。実用の目覚ましの代わりにしないでください。デモは記録に加算しません。</p>
</main><script>
const $=id=>document.getElementById(id),key='move-to-wake-habit-v1';let data={time:'',goal:10,exercise:'squat',logs:[]};try{const x=JSON.parse(localStorage.getItem(key));if(x&&Array.isArray(x.logs))data={...data,...x}}catch(e){}const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}};let active=false,demo=false,reps=0,ctx=null,ring=null,alarmDay='',soundAllowed=false;
const dayKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
$('time').value=data.time;$('goal').value=String(data.goal);$('exercise').value=data.exercise;
async function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();soundAllowed=ctx.state==='running';return soundAllowed}catch(e){return false}}
function beep(){if(!ctx||ctx.state!=='running')return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=850;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.15,ctx.currentTime+.03);g.gain.setValueAtTime(.15,ctx.currentTime+.35);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.52)}
function stopRing(){clearInterval(ring);ring=null;try{navigator.vibrate?.(0)}catch(e){}}
async function ringNow(){await unlock();if(!active)return;beep();stopRing();ring=setInterval(()=>{if(active){beep();try{navigator.vibrate?.([250,150,250])}catch(e){}}},750);if(!soundAllowed)$('status').textContent='画面は動作中です。音が出ない場合は消音設定を確認してください。'}
function start(isDemo){if(active)return;active=true;demo=isDemo;reps=0;$('count').textContent='0';$('outof').textContent=' / '+data.goal;$('alert').classList.remove('hidden');$('status').textContent=isDemo?'デモ実行中（記録には残りません）':'アラーム実行中';ringNow();$('alert').scrollIntoView({behavior:'smooth',block:'start'})}
function stop(completed){if(!active)return;active=false;stopRing();$('alert').classList.add('hidden');if(completed&&!demo){const today=dayKey(new Date()),old=data.logs.find(x=>x.date===today);if(old){old.reps+=reps;old.sessions=(old.sessions||1)+1}else data.logs.push({date:today,reps,sessions:1,exercise:data.exercise});save();render()}$('status').textContent=completed?(demo?'デモ完了！':'達成！記録しました 🎉'):'安全停止しました'}
$('enable').onclick=async()=>{const ok=await unlock();$('status').textContent=ok?'音声が有効になりました！':'音声を有効化できませんでした';if(ok)beep()};
$('demo').onclick=()=>{unlock();start(true)};
$('set').onclick=()=>{unlock();if(!$('time').value){$('status').textContent='時刻を選んでください';return}data.time=$('time').value;alarmDay='';save();tick();$('status').textContent=data.time+' に設定しました（画面を開いたままにしてください）'};
$('goal').onchange=()=>{data.goal=Number($('goal').value);save()};$('exercise').onchange=()=>{data.exercise=$('exercise').value;save()};
$('tap').onclick=()=>{if(!active)return;reps=Math.min(data.goal,reps+1);$('count').textContent=reps;if(reps>=data.goal)stop(true)};
$('emergency').onclick=()=>stop(false);
function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('ja-JP',{hour12:false});if(data.time&&now.toTimeString().slice(0,5)===data.time&&alarmDay!==dayKey(now)){alarmDay=dayKey(now);start(false)}}tick();setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('focus',tick);window.addEventListener('pagehide',stopRing);
function render(){const dates=[...new Set(data.logs.map(x=>x.date))].sort(),set=new Set(dates),today=new Date();let streak=0,c=new Date(today.getFullYear(),today.getMonth(),today.getDate());if(!set.has(dayKey(c)))c.setDate(c.getDate()-1);while(set.has(dayKey(c))){streak++;c.setDate(c.getDate()-1)}$('streak').textContent=streak;$('days').textContent=dates.length;$('total').textContent=data.logs.reduce((a,x)=>a+x.reps,0);const cal=$('calendar');cal.replaceChildren();for(const w of ['日','月','火','水','木','金','土']){const e=document.createElement('div');e.className='day empty';e.textContent=w;cal.append(e)}for(let i=0;i<new Date(today.getFullYear(),today.getMonth(),1).getDay();i++){const e=document.createElement('div');e.className='day empty';cal.append(e)}for(let i=1;i<=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();i++){const e=document.createElement('div'),d=dayKey(new Date(today.getFullYear(),today.getMonth(),i));e.className='day'+(set.has(d)?' done':'')+(d===dayKey(today)?' today':'');e.textContent=i;cal.append(e)}$('badges').textContent=[dates.length>=1?'🌱 はじめの一歩':'🔒 はじめの一歩',streak>=3?'🔥 3日連続':'🔒 3日連続',dates.length>=7?'⭐ 7日達成':'🔒 7日達成',dates.length>=30?'🏆 30日達成':'🔒 30日達成'].join('　');$('history').replaceChildren();for(const x of [...data.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10)){const li=document.createElement('li');li.textContent=x.date+'：'+(x.exercise==='pushup'?'腕立て':'スクワット')+' '+x.reps+'回';$('history').append(li)}}render();$('reset').onclick=()=>{if(confirm('すべての記録を削除しますか？')){data.logs=[];save();render()}};if(data.time)$('status').textContent=data.time+' に設定済み（画面を開いたままにしてください）';
</script></body></html>
