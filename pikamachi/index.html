<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぴかまち｜清掃SNSデモ</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f5;color:#193a30}main{max-width:520px;margin:auto;padding:16px}.hero{background:#146c54;color:white;padding:22px;border-radius:18px}nav{display:flex;justify-content:space-around;margin:15px 0;background:white;border-radius:12px;padding:12px}button{border:0;border-radius:10px;padding:10px;cursor:pointer}button.primary{background:#16866c;color:white;font-weight:bold}.card{background:white;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0001}.photos{display:grid;grid-template-columns:1fr 1fr;gap:5px}.photos img{width:100%;height:170px;object-fit:cover;border-radius:8px}.muted{color:#72877e;font-size:12px}.heart{font-size:23px;background:none;color:#ec4564}.map{height:230px;background:repeating-linear-gradient(0deg,#e5eee6 0 42px,#d0dfd4 43px 45px),repeating-linear-gradient(90deg,#e5eee6 0 50px,#d0dfd4 51px 53px);border-radius:12px;display:flex;align-items:center;justify-content:space-around}.map button{background:white;font-size:26px}textarea{width:96%;padding:10px;border:1px solid #ddd;border-radius:8px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16866c;color:white;padding:12px 20px;border-radius:12px;display:none}@keyframes pop{50%{transform:scale(1.6)}}.pop{animation:pop .35s}</style><main><header class="hero"><h1>🧹 ぴかまち</h1><p>掃除して、投稿して、街をきれいに。</p><h2><span id="points">240</span> pt　♥ <span id="received">86</span></h2></header><nav><button onclick="tab('map')">📍 マップ</button><button onclick="tab('feed')">♥ 投稿</button><button onclick="tab('mine')">👤 マイページ</button></nav><section id="map" hidden><h3>清掃場所を探す</h3><div class="map"><button onclick="compose(0)">🚻</button><button onclick="compose(1)">🚻</button><button onclick="compose(2)">🚻</button></div><div id="places"></div><p class="muted">架空の地点です。実際の清掃には施設管理者の許可が必要です。</p></section><section id="feed"><h3>みんなの清掃記録</h3><div id="posts"></div></section><section id="mine" hidden><div class="card"><h3>🧤 あなた</h3><p>清掃回数：<b id="cleanCount">3</b>回</p><p>獲得ポイント：<b id="myPoints">240</b>pt</p></div><div id="minePosts"></div></section><section id="compose" hidden><div class="card"><h3 id="target"></h3><p>清掃前・清掃後（サンプル画像）</p><div class="photos"><img id="before" alt="清掃前"><img id="after" alt="清掃後"></div><p class="muted">画像はデモ用イメージです。実際の清掃記録ではありません。</p><textarea id="note" rows="3">きれいに掃除しました！</textarea><p><button class="primary" onclick="submitPost()">投稿して50pt獲得</button></p></div></section></main><div id="toast"></div><script>
const places=['みどり公園 公衆トイレ','駅前広場 公衆トイレ','中央遊歩道 トイレ'];const photoSets=[{before:'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=600&auto=format&fit=crop',after:'https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=600&auto=format&fit=crop'},{before:'https://images.unsplash.com/photo-1620626011761-996317b8d101?w=600&auto=format&fit=crop',after:'https://images.unsplash.com/photo-1564540583246-934409427776?w=600&auto=format&fit=crop'},{before:'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=600&auto=format&fit=crop&crop=left',after:'https://images.unsplash.com/photo-1620626011761-996317b8d101?w=600&auto=format&fit=crop&crop=right'}];let points=240,received=86,cleanCount=3,selected=0;let posts=[{user:'はるか',place:places[0],note:'洗面台と鏡を掃除しました！',likes:42,liked:false,own:false,photoIndex:0},{user:'そうた',place:places[1],note:'床のごみ拾いと清掃が完了！',likes:28,liked:false,own:false,photoIndex:1},{user:'みお',place:places[2],note:'気持ちよく使ってもらえますように。',likes:16,liked:false,own:false,photoIndex:2}];function tab(t){for(const id of ['map','feed','mine','compose'])document.getElementById(id).hidden=id!==t;render()}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function compose(i){selected=i;document.getElementById('target').textContent=places[i]+' の清掃報告';document.getElementById('before').src=photoSets[i].before;document.getElementById('after').src=photoSets[i].after;tab('compose')}function update(){document.getElementById('points').textContent=points;document.getElementById('received').textContent=received;document.getElementById('myPoints').textContent=points;document.getElementById('cleanCount').textContent=cleanCount}function like(i){let p=posts[i];p.liked=!p.liked;p.likes+=p.liked?1:-1;if(p.own){received+=p.liked?1:-1;points+=p.liked?2:-2}update();render();toast(p.liked?'♥ いいね！':'いいねを取り消しました')}function render(){document.getElementById('places').innerHTML=places.map((p,i)=>'<div class="card"><b>'+p+'</b><p><button class="primary" onclick="compose('+i+')">清掃報告 ＋50pt</button></p></div>').join('');let card=(p,i)=>'<article class="card"><b>🧤 '+p.user+'</b><p class="muted">'+p.place+' · 清掃報告</p><div class="photos"><div><img src="'+photoSets[p.photoIndex??0].before+'" alt="清掃前のイメージ"><small>BEFORE</small></div><div><img src="'+photoSets[p.photoIndex??0].after+'" alt="清掃後のイメージ"><small>AFTER</small></div></div><p>'+p.note.replaceAll('<','&lt;')+'</p><button class="heart" onclick="like('+i+')">'+(p.liked?'♥':'♡')+'</button> '+p.likes+' いいね</article>';document.getElementById('posts').innerHTML=posts.map(card).join('');document.getElementById('minePosts').innerHTML=posts.map((p,i)=>p.own?card(p,i):'').join('')||'<p>まだ投稿はありません。</p>'}function submitPost(){posts.unshift({user:'あなた',place:places[selected],note:document.getElementById('note').value||'清掃しました！',likes:0,liked:false,own:true,photoIndex:selected});points+=50;cleanCount++;update();tab('feed');toast('投稿完了！ ＋50pt');setTimeout(()=>{if(posts[0]?.own){posts[0].likes+=8;received+=8;points+=16;update();render();toast('♥ 8人からいいね！ ＋16pt')}},2000)}update();render();
</script></html>
